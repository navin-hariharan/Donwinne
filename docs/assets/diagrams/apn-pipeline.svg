<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Ambient Petri nets in Donwinne</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="1000" height="680" rx="18" fill="#ffffff"/><text x="40" y="44" font-size="20" font-weight="800" fill="#0f172a">Ambient Petri nets in Donwinne (Konios, 2015)</text><text x="40" y="66" font-size="13" fill="#475569">From modelling with building blocks to behaviour, transformation, equivalence and verification. Chapters and definitions refer to the thesis.</text><rect x="40" y="96" width="250" height="86" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="165.0" y="121.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Building blocks</text><text x="165.0" y="142.0" text-anchor="middle" font-size="12.5" fill="#334155">root net, basic step net, one step net</text><text x="165.0" y="159.0" text-anchor="middle" font-size="12.5" fill="#334155">forward / backward composition (ch. 4)</text><rect x="375" y="96" width="250" height="86" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="500.0" y="121.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">APN  N</text><text x="500.0" y="142.0" text-anchor="middle" font-size="12.5" fill="#334155">places, colour-sensitive inhibitor</text><text x="500.0" y="159.0" text-anchor="middle" font-size="12.5" fill="#334155">arcs, capacities (Def. 3)</text><rect x="710" y="96" width="250" height="86" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="835.0" y="121.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Step token game</text><text x="835.0" y="142.0" text-anchor="middle" font-size="12.5" fill="#334155">structured transitions, steps,</text><text x="835.0" y="159.0" text-anchor="middle" font-size="12.5" fill="#334155">conflicts, maximal steps (Sec. 3.3)</text><line x1="290" y1="139" x2="373" y2="139" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="331.5" y="131.0" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">compose</text><line x1="625" y1="139" x2="708" y2="139" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="666.5" y="131.0" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">play</text><rect x="375" y="250" width="250" height="86" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="500.0" y="275.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">CRG(N)</text><text x="500.0" y="296.0" text-anchor="middle" font-size="12.5" fill="#334155">concurrent reachability graph</text><text x="500.0" y="313.0" text-anchor="middle" font-size="12.5" fill="#334155">of all steps (Sec. 3.3)</text><line x1="500" y1="182" x2="500" y2="248" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="552.0" y="215.0" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">step semantics</text><rect x="40" y="250" width="250" height="86" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="165.0" y="275.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">APN properties</text><text x="165.0" y="296.0" text-anchor="middle" font-size="12.5" fill="#334155">composite step net, pure, ordinary,</text><text x="165.0" y="313.0" text-anchor="middle" font-size="12.5" fill="#334155">live, k-bounded, reversible (ch. 4)</text><line x1="375" y1="293" x2="292" y2="293" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="710" y="250" width="250" height="86" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="835.0" y="275.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">T-APN  φ(N)</text><text x="835.0" y="296.0" text-anchor="middle" font-size="12.5" fill="#334155">transformed APN: inhibitors</text><text x="835.0" y="313.0" text-anchor="middle" font-size="12.5" fill="#334155">replaced by complements (Defs 20-21)</text><path d="M625 139 C 680 190, 790 190, 835 248" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="760" y="212" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">construction φ (ch. 6)</text><rect x="710" y="404" width="250" height="86" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="835.0" y="429.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">CRG(φ(N))</text><text x="835.0" y="450.0" text-anchor="middle" font-size="12.5" fill="#334155">concurrent reachability graph</text><text x="835.0" y="467.0" text-anchor="middle" font-size="12.5" fill="#334155">of the T-APN</text><line x1="835" y1="336" x2="835" y2="402" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><line x1="625" y1="447" x2="708" y2="447" stroke="#64748b" stroke-width="2" marker-end="url(#a)" marker-start="url(#a0)"/><text x="666" y="433" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">equivalence</text><text x="666" y="466" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">(Theorem 1)</text><rect x="375" y="404" width="250" height="86" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="500.0" y="429.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Equivalence check</text><text x="500.0" y="450.0" text-anchor="middle" font-size="12.5" fill="#334155">isomorphic CRGs, or a replayable</text><text x="500.0" y="467.0" text-anchor="middle" font-size="12.5" fill="#334155">counterexample (Sec. 6.6)</text><path d="M500 336 L 500 402" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="404" width="250" height="86" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="165.0" y="429.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Transition system</text><text x="165.0" y="450.0" text-anchor="middle" font-size="12.5" fill="#334155">steps, maximal steps, one transition</text><text x="165.0" y="467.0" text-anchor="middle" font-size="12.5" fill="#334155">at a time, or colour-blind (Sec. 7.3.1)</text><path d="M760 490 C 700 530, 360 530, 210 492" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="610" y="506" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">state space of N or φ(N)</text><rect x="40" y="540" width="250" height="76" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="165.0" y="560.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">CTL model checking (ch. 7)</text><text x="165.0" y="581.0" text-anchor="middle" font-size="12.5" fill="#334155">22 property templates,</text><text x="165.0" y="598.0" text-anchor="middle" font-size="12.5" fill="#334155">witnesses, counterexamples</text><rect x="375" y="540" width="250" height="76" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="500.0" y="560.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Paths and fault tolerance</text><text x="500.0" y="581.0" text-anchor="middle" font-size="12.5" fill="#334155">advice followed or ignored (7.3.2)</text><text x="500.0" y="598.0" text-anchor="middle" font-size="12.5" fill="#334155">wrong advice (7.3.3)</text><line x1="165" y1="490" x2="165" y2="538" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="710" y="540" width="250" height="76" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="835.0" y="560.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Replay in the token game</text><text x="835.0" y="581.0" text-anchor="middle" font-size="12.5" fill="#334155">every witness and path</text><text x="835.0" y="598.0" text-anchor="middle" font-size="12.5" fill="#334155">plays back on the canvas</text><path d="M290 460 C 360 480, 440 500, 470 538" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><line x1="625" y1="578" x2="708" y2="578" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M165 616 C 165 668, 835 668, 835 618" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="500" y="646" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">replay a witness or a path</text></svg>
