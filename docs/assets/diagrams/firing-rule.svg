<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">The firing rule</title>
  <desc id="desc">Before: p1 holds two tokens, p2 one token, p3 none; transition t needs two tokens from p1 and one from p2, so it is enabled. After t fires, p1 and p2 are empty and p3 holds one token.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d2330"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="800" height="320" fill="#ffffff"/>
  <text x="180" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1d2330">Before: t is enabled</text>
  <text x="620" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1d2330">After t fires</text>

  <!-- Before -->
  <g stroke="#1d2330" stroke-width="2" fill="none">
    <circle cx="60" cy="100" r="26" fill="#fff"/>
    <circle cx="60" cy="200" r="26" fill="#fff"/>
    <rect x="166" y="125" width="16" height="50" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
    <circle cx="300" cy="150" r="26" fill="#fff"/>
    <path d="M85,108 L164,140" marker-end="url(#arrow)"/>
    <path d="M85,192 L164,160" marker-end="url(#arrow)"/>
    <path d="M184,150 L272,150" marker-end="url(#arrow)"/>
  </g>
  <g fill="#1d2330">
    <circle cx="52" cy="100" r="5"/><circle cx="68" cy="100" r="5"/>
    <circle cx="60" cy="200" r="5"/>
  </g>
  <g font-size="14" fill="#1d2330">
    <text x="60" y="146" text-anchor="middle">p1</text>
    <text x="60" y="246" text-anchor="middle">p2</text>
    <text x="174" y="116" text-anchor="middle" font-weight="600">t</text>
    <text x="300" y="196" text-anchor="middle">p3</text>
    <text x="128" y="112" text-anchor="middle" fill="#2563eb" font-weight="700">2</text>
  </g>

  <!-- Arrow between -->
  <path d="M370,150 L430,150" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="400" y="138" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="600">fire t</text>

  <!-- After -->
  <g transform="translate(440,0)">
    <g stroke="#1d2330" stroke-width="2" fill="none">
      <circle cx="60" cy="100" r="26" fill="#fff"/>
      <circle cx="60" cy="200" r="26" fill="#fff"/>
      <rect x="166" y="125" width="16" height="50" fill="#fff"/>
      <circle cx="300" cy="150" r="26" fill="#fff"/>
      <path d="M85,108 L164,140" marker-end="url(#arrow)"/>
      <path d="M85,192 L164,160" marker-end="url(#arrow)"/>
      <path d="M184,150 L272,150" marker-end="url(#arrow)"/>
    </g>
    <circle cx="300" cy="150" r="5" fill="#1d2330"/>
    <g font-size="14" fill="#1d2330">
      <text x="60" y="146" text-anchor="middle">p1</text>
      <text x="60" y="246" text-anchor="middle">p2</text>
      <text x="174" y="116" text-anchor="middle" font-weight="600">t</text>
      <text x="300" y="196" text-anchor="middle">p3</text>
      <text x="128" y="112" text-anchor="middle" fill="#2563eb" font-weight="700">2</text>
    </g>
  </g>
  <text x="400" y="284" text-anchor="middle" font-size="13.5" fill="#5f6b7d">An arc's weight (here 2) says how many tokens it takes or adds.</text>
  <text x="400" y="304" text-anchor="middle" font-size="13.5" fill="#5f6b7d">t is enabled because p1 has 2 tokens and p2 has 1. Firing takes them and puts 1 token on p3.</text>
</svg>
