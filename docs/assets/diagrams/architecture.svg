<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Donwinne packages and dependencies</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="1000" height="600" rx="18" fill="#ffffff"/><text x="40" y="44" font-size="20" font-weight="800" fill="#0f172a">Donwinne: packages and dependencies</text><text x="40" y="66" font-size="13" fill="#475569">An arrow means "imports". Every engine package is plain TypeScript with no UI, so it runs in tests, the browser and Electron alike.</text><rect x="170" y="92" width="280" height="74" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="310.0" y="120.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">apps/web</text><text x="310.0" y="141.0" text-anchor="middle" font-size="12.5" fill="#334155">Vite web app, PWA (manifest, service worker)</text><rect x="550" y="92" width="280" height="74" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="690.0" y="111.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">apps/desktop</text><text x="690.0" y="132.0" text-anchor="middle" font-size="12.5" fill="#334155">Electron shell: native menus,</text><text x="690.0" y="149.0" text-anchor="middle" font-size="12.5" fill="#334155">file dialogs, preload bridge</text><rect x="270" y="214" width="460" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="500.0" y="236.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">@pns/editor</text><text x="500.0" y="257.0" text-anchor="middle" font-size="12.5" fill="#334155">React + Zustand: canvas, palette, panels, dialogs,</text><text x="500.0" y="274.0" text-anchor="middle" font-size="12.5" fill="#334155">token games, plots, CTL and ambient dialogs</text><line x1="310" y1="166" x2="400" y2="212" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><line x1="690" y1="166" x2="600" y2="212" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="350" width="165" height="84" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="122.5" y="374.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">@pns/sim</text><text x="122.5" y="395.0" text-anchor="middle" font-size="12.5" fill="#334155">simulation, timed game,</text><text x="122.5" y="412.0" text-anchor="middle" font-size="12.5" fill="#334155">reachability, unfolding</text><line x1="500" y1="294" x2="122" y2="348" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="230" y="350" width="165" height="84" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="312.5" y="374.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">@pns/analysis</text><text x="312.5" y="395.0" text-anchor="middle" font-size="12.5" fill="#334155">properties, invariants,</text><text x="312.5" y="412.0" text-anchor="middle" font-size="12.5" fill="#334155">CTL, paths, faults</text><line x1="500" y1="294" x2="312" y2="348" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="420" y="350" width="165" height="84" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="502.5" y="374.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">@pns/apn</text><text x="502.5" y="395.0" text-anchor="middle" font-size="12.5" fill="#334155">APN/T-APN steps, CRG,</text><text x="502.5" y="412.0" text-anchor="middle" font-size="12.5" fill="#334155">blocks, φ, equivalence</text><line x1="500" y1="294" x2="502" y2="348" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="610" y="350" width="165" height="84" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="692.5" y="374.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">@pns/ft</text><text x="692.5" y="395.0" text-anchor="middle" font-size="12.5" fill="#334155">fault trees: BDD, cut sets,</text><text x="692.5" y="412.0" text-anchor="middle" font-size="12.5" fill="#334155">importance, Monte Carlo</text><line x1="500" y1="294" x2="692" y2="348" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="800" y="350" width="165" height="84" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="882.5" y="374.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">@pns/io</text><text x="882.5" y="395.0" text-anchor="middle" font-size="12.5" fill="#334155">Snoopy, PNML, ANDL</text><text x="882.5" y="412.0" text-anchor="middle" font-size="12.5" fill="#334155">and 12 exporters</text><line x1="500" y1="294" x2="882" y2="348" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><line x1="230" y1="392" x2="207" y2="392" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="270" y="492" width="460" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="500.0" y="514.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">@pns/core</text><text x="500.0" y="535.0" text-anchor="middle" font-size="12.5" fill="#334155">net model, expression language, multisets,</text><text x="500.0" y="552.0" text-anchor="middle" font-size="12.5" fill="#334155">firing rules, ambient (APN) definitions</text><line x1="122" y1="434" x2="329.9" y2="490" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><line x1="312" y1="434" x2="415.4" y2="490" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><line x1="502" y1="434" x2="500.9" y2="490" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><line x1="692" y1="434" x2="586.4" y2="490" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><line x1="882" y1="434" x2="671.9" y2="490" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/></svg>
