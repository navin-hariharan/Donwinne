<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Stubborn sets</title>
  <desc id="desc">Three independent transitions a, b and c can fire in any order: the full state space has 8 states forming a cube of interleavings. With stubborn sets only one order is explored, 4 states in a line, and the final state is still reached.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7d"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="800" height="330" fill="#fff"/>
  <text x="200" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1d2330">Full state space: 8 states</text>
  <text x="610" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1d2330">Stubborn sets: 4 states</text>
  <!-- cube: levels 0..3 -->
  <g stroke="#5f6b7d" stroke-width="1.6" fill="none">
    <path d="M200,62 L118,118" marker-end="url(#a)"/><path d="M200,62 L200,116" marker-end="url(#a)"/><path d="M200,62 L282,118" marker-end="url(#a)"/>
    <path d="M110,140 L110,196" marker-end="url(#a)"/><path d="M118,138 L194,198" marker-end="url(#a)"/>
    <path d="M194,138 L118,198" marker-end="url(#a)"/><path d="M206,138 L282,198" marker-end="url(#a)"/>
    <path d="M282,138 L206,198" marker-end="url(#a)"/><path d="M290,140 L290,196" marker-end="url(#a)"/>
    <path d="M118,220 L194,276" marker-end="url(#a)"/><path d="M200,222 L200,274" marker-end="url(#a)"/><path d="M282,220 L206,276" marker-end="url(#a)"/>
  </g>
  <g fill="#fff" stroke="#1d2330" stroke-width="2">
    <circle cx="200" cy="50" r="12"/>
    <circle cx="110" cy="128" r="12"/><circle cx="200" cy="128" r="12"/><circle cx="290" cy="128" r="12"/>
    <circle cx="110" cy="208" r="12"/><circle cx="200" cy="208" r="12"/><circle cx="290" cy="208" r="12"/>
    <circle cx="200" cy="286" r="12"/>
  </g>
  <g font-size="12.5" fill="#5f6b7d" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke">
    <text x="146" y="84">a</text><text x="210" y="92">b</text><text x="254" y="84">c</text>
    <text x="98" y="172">b</text><text x="134" y="150">c</text><text x="180" y="150">a</text><text x="222" y="150">c</text><text x="268" y="150">a</text><text x="302" y="172">b</text>
    <text x="146" y="258">c</text><text x="210" y="252">b</text><text x="254" y="258">a</text>
  </g>
  <!-- reduced: a line -->
  <g stroke="#2563eb" stroke-width="2.2" fill="none">
    <path d="M610,62 L610,116" marker-end="url(#ab)"/><path d="M610,140 L610,196" marker-end="url(#ab)"/><path d="M610,220 L610,274" marker-end="url(#ab)"/>
  </g>
  <g fill="#fff" stroke="#2563eb" stroke-width="2.4">
    <circle cx="610" cy="50" r="12"/><circle cx="610" cy="128" r="12"/><circle cx="610" cy="208" r="12"/><circle cx="610" cy="286" r="12"/>
  </g>
  <g font-size="13" fill="#2563eb" font-weight="600"><text x="622" y="94">a</text><text x="622" y="174">b</text><text x="622" y="252">c</text></g>
  <g font-size="12.5" fill="#5f6b7d">
    <text x="660" y="54">start</text><text x="660" y="290">same end state</text>
  </g>
  <text x="400" y="322" text-anchor="middle" font-size="13" fill="#5f6b7d">a, b and c are independent, so one order is enough to find every deadlock. With n such transitions: 2^n states against n + 1.</text>
</svg>
