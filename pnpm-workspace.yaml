packages:
  - "packages/*"
  - "apps/*"

onlyBuiltDependencies:
  - electron
  - esbuild

# Security: patched versions of transitive dependencies of the desktop packager (electron-builder).
overrides:
  fast-uri: ^3.1.9
  "@electron/universal>minimatch": ^11.0.9
  "app-builder-lib>minimatch": ^11.0.9
